    <ellipse cx="938" cy="190" rx="151" ry="121" transform="rotate(34 938 190)" opacity=".2"/>
    <circle cx="938" cy="190" r="142" stroke-dasharray="3 10" opacity=".22"/>
  </g>
  <circle cx="938" cy="190" r="91" fill="#a5b4fc" opacity=".05"/>
  <circle cx="938" cy="190" r="77" fill="url(#moon)"/>
  <g fill="#6c83bd" opacity=".16"><circle cx="913" cy="167" r="19"/><circle cx="965" cy="208" r="25"/><circle cx="917" cy="226" r="10"/><circle cx="963" cy="160" r="9"/></g>
  <circle cx="1087" cy="113" r="5" fill="#67e8f9"/>
  <circle cx="812" cy="276" r="4" fill="#c4b5fd"/>
  <path d="M1093 235v12m-6-6h12M713 149v8m-4-4h8" stroke="#67e8f9" stroke-width="1.5"/>

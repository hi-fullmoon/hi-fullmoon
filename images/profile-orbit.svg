<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Zhengbiwen — Code under the moon</title>
  <desc id="desc">深蓝星空中的月亮与青紫色轨道，接近真理，接近现实。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f23"/><stop offset="1" stop-color="#191338"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".3" cy=".25"><stop stop-color="#fff"/><stop offset=".55" stop-color="#dce9ff"/><stop offset="1" stop-color="#8fa9e8"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".055"/></pattern>
  </defs>

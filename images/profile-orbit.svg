  <text x="82" y="94" fill="#93c5fd" font-family="monospace" font-size="16" letter-spacing="4">HI-FULLMOON / DEVELOPER</text>
  <text x="64" y="169" fill="#f1f5ff" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Zhengbiwen<tspan fill="#67e8f9">.</tspan></text>
  <text x="67" y="215" fill="#b9c5e5" font-family="Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="3">CODE UNDER THE MOON</text>

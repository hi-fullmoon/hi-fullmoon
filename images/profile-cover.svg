<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Zhengbiwen · Independent Developer</title>
  <desc id="desc">炭黑底色、香槟金日蚀和大幅留白。接近真理，接近现实。</desc>
  <defs>
    <radialGradient id="atmosphere" cx=".78" cy=".43" r=".65"><stop stop-color="#29251e"/><stop offset=".55" stop-color="#151515"/><stop offset="1" stop-color="#101112"/></radialGradient>
    <radialGradient id="halo"><stop offset=".65" stop-color="#c9ad77" stop-opacity="0"/><stop offset=".78" stop-color="#c9ad77" stop-opacity=".12"/><stop offset=".86" stop-color="#c9ad77" stop-opacity=".035"/><stop offset="1" stop-color="#c9ad77" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4e7c6"/><stop offset=".35" stop-color="#bfa471"/><stop offset=".7" stop-color="#625443"/><stop offset="1" stop-color="#20201e"/></linearGradient>
    <radialGradient id="sphere" cx=".22" cy=".2" r=".85"><stop stop-color="#282724"/><stop offset=".45" stop-color="#171819"/><stop offset="1" stop-color="#101112"/></radialGradient>
    <clipPath id="frame"><rect width="1600" height="640" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="url(#atmosphere)"/>
    <circle cx="1290" cy="288" r="390" fill="url(#halo)"/>
    <circle cx="1290" cy="288" r="300" fill="url(#rim)"/>
    <circle cx="1294" cy="292" r="298" fill="url(#sphere)"/>
    <path d="M101 88H143" stroke="#c3ad83" stroke-width="2"/>
    <text x="161" y="93" fill="#b9b5ad" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="5">HI–FULLMOON</text>
    <text x="100" y="265" fill="#f1eee7" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="600" letter-spacing="-5">Zhengbiwen</text>
    <text x="105" y="327" fill="#aaa69e" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="2">Thoughtful tools. Quiet ambition.</text>
    <text x="105" y="415" fill="#d5c4a4" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="300" letter-spacing="7">接近真理，接近现实。</text>
    <path d="M104 528H1496" stroke="#c5b48f" stroke-opacity=".2"/>
    <text x="105" y="575" fill="#8d8b85" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">INDEPENDENT DEVELOPER</text>
    <text x="1495" y="575" text-anchor="end" fill="#8d8b85" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">DESKTOP · MOBILE · TOOLS</text>
  </g>
</svg>
